name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

jobs:
  pr-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Build
        run: npm run build
  
  claude-pr-deploy:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    needs: pr-checks
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          date=$(date +%Y%m%d%H%M%S)
          VERSION="1.0.0-${date}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get commit hash
        id: commit
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Viam Build 🚀
        uses: viamrobotics/build-action@v1.7
        with:
          version: ${{ steps.version.outputs.version }}
          ref: ${{ steps.commit.outputs.commit_hash }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
          meta-path: meta-claude.json

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            Build complete: https://app.viam.com/module/ncs/sanding-monitoring-web-app-claude-dev
