name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.new-version.outputs.new_version }}

    steps:
      - name: Checkout 🛎️
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        # actions/setup-node@v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      # Rollback tags carry a suffix, so only plain x.y.z tags count as releases.
      - name: Get latest tag
        id: latest-tag
        run: |
          TAG=$(git tag --list --sort=-v:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1)
          if [ -z "$TAG" ]; then
            TAG="0.0.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: new-version
        env:
          LATEST: ${{ steps.latest-tag.outputs.tag }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          NEW="$MAJOR.$((MINOR+1)).0"

          if git rev-parse -q --verify "refs/tags/$NEW" >/dev/null; then
            echo "Computed tag $NEW already exists — refusing to overwrite." >&2
            exit 1
          fi

          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Create release
        # softprops/action-gh-release@v3.0.3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ steps.new-version.outputs.new_version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.new-version.outputs.new_version }}
          generate_release_notes: true
          make_latest: true

  # A release created with GITHUB_TOKEN does not fire `release: published`,
  # so the deploy is called directly instead of waiting on that event.
  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      tag_name: ${{ needs.build.outputs.new_version }}
