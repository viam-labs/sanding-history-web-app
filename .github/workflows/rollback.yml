name: Rollback to Tag

on:
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Tag to rollback to (e.g. 1.4.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine rollback commit
        id: rollback
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          LATEST=$(git tag --list --sort=-v:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1)
          COMMIT=$(git rev-list -n 1 "$ROLLBACK_TAG")
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Determine next patch version
        id: version
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          LATEST: ${{ steps.rollback.outputs.latest }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          NEW_TAG="$MAJOR.$MINOR.$((PATCH + 1))-rollback-${ROLLBACK_TAG}-$(date +%Y%m%d%H%M%S)"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create rollback tag
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          COMMIT: ${{ steps.rollback.outputs.commit }}
        run: |
          git tag "$NEW_TAG" "$COMMIT"
          git push origin "$NEW_TAG"

      - name: Check out rollback commit
        env:
          COMMIT: ${{ steps.rollback.outputs.commit }}
        run: git checkout --detach "$COMMIT"

      - name: Setup Node
        # actions/setup-node@v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Build module
        run: make module

      # do-update would push the old commit's meta.json to the registry; a rollback only swaps the bundle.
      - name: Upload to Viam
        # viamrobotics/upload-module@v1.2
        uses: viamrobotics/upload-module@31b3909ba4d40f22a58c8479f3b4302538a5099b
        with:
          platform: any
          do-update: false
          version: ${{ steps.version.outputs.new_tag }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
