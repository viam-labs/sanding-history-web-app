name: Rollback to Tag

on:
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Tag to rollback to (e.g. 1.4.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine rollback commit
        id: rollback
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          LATEST=$(git tag --list --sort=-v:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1)
          COMMIT=$(git rev-list -n 1 "$ROLLBACK_TAG")
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Determine next patch version
        id: version
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          LATEST: ${{ steps.rollback.outputs.latest }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
          NEW_TAG="$MAJOR.$MINOR.$((PATCH + 1))-rollback-${ROLLBACK_TAG}-$(date +%Y%m%d%H%M%S)"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create rollback tag
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          COMMIT: ${{ steps.rollback.outputs.commit }}
        run: |
          git tag "$NEW_TAG" "$COMMIT"
          git push origin "$NEW_TAG"

      - name: Viam Build 🚀
        # viamrobotics/build-action@v1.7.4
        uses: viamrobotics/build-action@76223a61df515ed39aed8836611e71e868c06d66
        with:
          version: ${{ steps.version.outputs.new_tag }}
          ref: ${{ steps.rollback.outputs.commit }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
