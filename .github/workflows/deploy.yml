# see https://github.com/viamrobotics/build-action for help
name: Deploy

# `release: published` covers releases made by hand in the GitHub UI;
# `workflow_call` covers the ones main.yml creates on merge.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      # viamrobotics/build-action@v1.7.4
      - uses: viamrobotics/build-action@76223a61df515ed39aed8836611e71e868c06d66
        with:
          version: ${{ inputs.tag_name || github.ref_name }}
          ref: ${{ github.sha }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
