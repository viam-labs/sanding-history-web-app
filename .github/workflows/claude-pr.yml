name: Claude PR Fix

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  pr-fix:
    if: >-
      github.repository_owner == 'viam-labs' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude-fix')
    # viamrobotics/claude-ci-workflows@v1.14.0
    uses: viamrobotics/claude-ci-workflows/.github/workflows/claude-pr-fix.yml@0a9af2603e5218af7448f59536a9f698b35d235f
    with:
      repository_owner: viam-labs
      install_command: make setup-linux && npm ci
      allowed_tools: 'Edit,Read,Write,Glob,Grep,Bash(npm run build*),Bash(npm run lint*),Bash(npm run test*),Bash(git config *),Bash(git add *),Bash(git commit *),Bash(git push *),Bash(git status*),Bash(git diff*),Bash(git log*),Bash(git checkout *),Bash(git branch *),Bash(git rev-parse *),Bash(git fetch *)'
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GIT_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
